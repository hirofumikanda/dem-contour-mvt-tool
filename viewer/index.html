<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>等高線PMTilesビューワ</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      #comparison-container {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      /*
       * ID selectors (not .map) so this reliably outranks maplibre-gl.css's
       * `.maplibregl-map { position: relative }` regardless of stylesheet
       * load order (maplibre-gl.css is injected via a JS import, after this
       * inline <style> block).
       */
      #before,
      #after {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="comparison-container">
      <div id="before"></div>
      <div id="after"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
